<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5c4d" />
  <title>JobSprint</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon192.png" />
  <style>
    :root { --accent: #1f5c4d; --line: #e4e6ea; --muted: #6b6e76; --danger: #ae2e24; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2125; background: #f6f7f9; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--accent); color: #fff; }
    header h1 { margin: 0; font-size: 19px; }
    header button { background: none; border: 0; color: #fff; font-size: 22px; padding: 4px 8px; }
    main { padding: 16px; max-width: 560px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #cfd3d9; border-radius: 10px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(31,92,77,.25); border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .btn { display: block; width: 100%; padding: 14px; margin-top: 14px; border-radius: 10px; border: 1px solid #c7cad1; background: #fff; font: 600 16px system-ui, sans-serif; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:disabled { opacity: .6; }
    .check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-weight: 500; color: inherit; font-size: 15px; }
    .check input { width: 20px; height: 20px; }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .status { white-space: pre-line; padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 600; }
    .status.ok { background: #e3fcef; color: #164b35; }
    .status.err { background: #ffeceb; color: var(--danger); }
    .status.info { background: #e9f2ff; color: #0c3e7a; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 10px 0; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li .t { font-weight: 600; }
    li .m { color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>JobSprint</h1>
    <button id="settingsBtn" aria-label="Settings">⚙</button>
  </header>
  <main>
    <div id="status" class="status" hidden></div>

    <section id="settings" class="card" hidden>
      <h2>Settings</h2>
      <label for="webhook">Google Apps Script webhook URL</label>
      <input id="webhook" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" />
      <label class="check"><input id="quick" type="checkbox" /> Save instantly when shared (no review screen)</label>
      <label class="check"><input id="autoBack" type="checkbox" /> Go back to LinkedIn/Naukri automatically after saving</label>
      <button id="saveSettings" class="btn primary">Save settings</button>
      <p class="hint">Use the same URL as the Chrome extension so everything lands in one sheet.
        Then tap Chrome's ⋮ menu → <b>Add to Home screen → Install</b>, and "JobSprint" shows up in every app's Share menu.</p>
    </section>

    <section class="card">
      <h2>Shortlist a job</h2>
      <form id="jobForm">
        <label for="title">Job title</label>
        <input id="title" autocomplete="off" />
        <label for="company">Company</label>
        <input id="company" autocomplete="off" />
        <label for="url">Job link</label>
        <input id="url" type="url" inputmode="url" autocomplete="off" />
        <div class="row">
          <div>
            <label for="statusSel">Status</label>
            <select id="statusSel">
              <option>Shortlisted</option><option>Saved</option><option>Applied</option><option>Interview</option>
            </select>
          </div>
          <div>
            <label for="source">Source</label>
            <input id="source" autocomplete="off" />
          </div>
        </div>
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="e.g. referral from Arun, apply via ATS"></textarea>
        <button id="saveBtn" type="submit" class="btn primary">Save to sheet</button>
        <button id="pasteBtn" type="button" class="btn">Paste link from clipboard</button>
      </form>
    </section>

    <section class="card" id="recentCard" hidden>
      <h2>Recently saved on this phone</h2>
      <ul id="recent"></ul>
    </section>
  </main>

  <script src="parse.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const store = {
      get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
    };

    function show(msg, kind = 'ok') {
      const s = $('status');
      s.textContent = msg;
      s.className = 'status ' + kind;
      s.hidden = false;
    }

    function fillForm(p) {
      $('title').value = p.title || '';
      $('company').value = p.company || '';
      $('url').value = p.url || '';
      $('source').value = p.source || '';
    }

    function renderRecent() {
      const items = store.get('recent', []);
      $('recentCard').hidden = !items.length;
      $('recent').replaceChildren(...items.map((r) => {
        const li = document.createElement('li');
        const t = document.createElement('div'); t.className = 't';
        t.textContent = [r.title || '(untitled)', r.company].filter(Boolean).join(' · ');
        const m = document.createElement('div'); m.className = 'm';
        m.textContent = [r.status, r.source, new Date(r.at).toLocaleString(), r.queued && 'waiting to sync'].filter(Boolean).join(' · ');
        li.append(t, m);
        return li;
      }));
    }

    function remember(payload, queued) {
      const items = store.get('recent', []).filter((r) => r.url !== payload.url || !payload.url);
      items.unshift({ ...payload, at: Date.now(), queued });
      store.set('recent', items.slice(0, 15));
      renderRecent();
    }

    async function post(payload) {
      const webhook = store.get('webhook', '');
      if (!webhook) throw Object.assign(new Error('Add your webhook URL in ⚙ Settings first'), { fatal: true });
      const body = JSON.stringify(payload);
      try {
        // text/plain = "simple" request: no CORS preflight, Apps Script reads e.postData.contents.
        const res = await fetch(webhook, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
        const data = await res.json().catch(() => ({ ok: res.ok }));
        if (data.ok === false) throw Object.assign(new Error(data.error || 'Sheet script error'), { fatal: true });
        return data;
      } catch (err) {
        if (err.fatal || !navigator.onLine) throw err;
        // Online but response unreadable (CORS quirk) → send blind; the script de-duplicates by URL.
        await fetch(webhook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
        return { ok: true, action: 'sent' };
      }
    }

    // ---------- Return to the app that shared ----------
    let fromShare = false;
    const autoBack = () => store.get('autoBack', true);

    // A window opened by a share is allowed to close itself; Android then shows
    // the app you shared from. If the browser refuses, say how to go back.
    function closeSoon(ms) {
      if (!fromShare || !autoBack()) return;
      setTimeout(() => {
        window.close();
        setTimeout(() => { if (!document.hidden) show($('status').textContent + '\nDone. Swipe back to return.', 'ok'); }, 400);
      }, ms);
    }

    // Instant save for quick mode: the browser delivers it even after this window closes.
    function beacon(payload) {
      const webhook = store.get('webhook', '');
      if (!webhook || !navigator.onLine || !navigator.sendBeacon) return false;
      return navigator.sendBeacon(webhook, new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' }));
    }

    function quickSave(payload) {
      const name = [payload.title, payload.company].filter(Boolean).join(' · ') || payload.url;
      if (beacon(payload)) {
        remember(payload, false);
        show(`Saved: ${name}`, 'ok');
      } else {
        const q = store.get('queue', []); q.push(payload); store.set('queue', q);
        remember(payload, true);
        show(`Offline. Saved on the phone: ${name}. It will sync next time you open JobSprint online.`, 'info');
      }
      if (navigator.vibrate) navigator.vibrate(30);
      $('jobForm').reset();
      closeSoon(450);
    }

    async function save(payload) {
      $('saveBtn').disabled = true;
      try {
        const r = await post(payload);
        const name = [r.title || payload.title, r.company || payload.company].filter(Boolean).join(' · ') || payload.url;
        let msg = r.action === 'updated' ? `Already in sheet, updated → ${r.status}: ${name}`
          : r.action === 'sent' ? `Sent to sheet: ${name}` : `Added to sheet: ${name}`;
        const missingDetails = !(r.title || payload.title) || !(r.company || payload.company);
        // Only a failed lookup needs you; leaving a field blank on purpose doesn't.
        const needsAttention = r.action !== 'sent' && missingDetails && String(r.lookup || '').startsWith('failed');
        if (needsAttention) {
          msg += `\nCouldn't look up the title/company (${r.lookup.slice(8)}). Type them in and save again, or use JobSprint → Fill missing in the sheet.`;
        }
        show(msg, needsAttention ? 'info' : 'ok');
        remember({ ...payload, title: r.title || payload.title, company: r.company || payload.company }, false);
        $('jobForm').reset();
        if (!needsAttention) closeSoon(900); // stay open if you need to fill in details
        return true;
      } catch (err) {
        if (err.fatal) { show(err.message, 'err'); if (/webhook/i.test(err.message)) $('settings').hidden = false; return false; }
        const q = store.get('queue', []); q.push(payload); store.set('queue', q);
        remember(payload, true);
        show('Offline. Saved on the phone, will sync when you are back online.', 'info');
        $('jobForm').reset();
        closeSoon(1500);
        return true;
      } finally {
        $('saveBtn').disabled = false;
      }
    }

    async function flushQueue() {
      const q = store.get('queue', []);
      if (!q.length || !navigator.onLine || !store.get('webhook', '')) return;
      const left = [];
      for (const p of q) { try { await post(p); } catch { left.push(p); } }
      store.set('queue', left);
      const recent = store.get('recent', []).map((r) => ({ ...r, queued: left.some((p) => p.url === r.url) }));
      store.set('recent', recent);
      renderRecent();
      if (q.length > left.length) show(`Synced ${q.length - left.length} queued job(s) to the sheet`, 'ok');
    }

    function payloadFromForm() {
      return {
        date: new Date().toISOString().slice(0, 10),
        title: $('title').value.trim(),
        company: $('company').value.trim(),
        url: $('url').value.trim(),
        status: $('statusSel').value,
        source: $('source').value.trim(),
        notes: $('notes').value.trim(),
      };
    }

    $('jobForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const p = payloadFromForm();
      if (!p.url && !p.title) return show('Add at least a link or a title', 'err');
      save(p);
    });

    $('pasteBtn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        fillForm(parseShare({ text }));
        show('Filled from clipboard. Check and save.', 'info');
      } catch { show('Clipboard not available. Long-press the link field and paste.', 'err'); }
    });

    $('settingsBtn').addEventListener('click', () => { $('settings').hidden = !$('settings').hidden; });
    $('saveSettings').addEventListener('click', () => {
      const url = $('webhook').value.trim();
      if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url) && !confirm('This does not look like an Apps Script URL. Save anyway?')) return;
      store.set('webhook', url);
      store.set('quick', $('quick').checked);
      store.set('autoBack', $('autoBack').checked);
      $('settings').hidden = true;
      show('Settings saved', 'ok');
      flushQueue();
    });

    window.addEventListener('online', flushQueue);

    // ---------- Init: handle an incoming share ----------
    (async () => {
      $('webhook').value = store.get('webhook', '');
      $('quick').checked = store.get('quick', false);
      $('autoBack').checked = autoBack();
      if (!store.get('webhook', '')) $('settings').hidden = false;
      renderRecent();

      const q = new URLSearchParams(location.search);
      const shared = { title: q.get('title') || '', text: q.get('text') || '', url: q.get('url') || '' };
      if (shared.title || shared.text || shared.url) {
        history.replaceState(null, '', location.pathname); // so a refresh doesn't re-save
        fromShare = true;
        const p = parseShare(shared);
        fillForm(p);
        if (store.get('quick', false) && p.url && store.get('webhook', '')) {
          quickSave(payloadFromForm());
          return; // window is closing; queued jobs sync next time the app opens normally
        } else {
          show(p.title ? 'Check the details and tap Save.'
            : 'Only a link was shared. Tap Save and the sheet will look up the title & company, or type them in.', 'info');
          $('title').focus();
        }
      }
      flushQueue();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    })();
  </script>
</body>
</html>
